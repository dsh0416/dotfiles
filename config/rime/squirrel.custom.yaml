patch:
  "style/color_scheme": custom_light
  "style/color_scheme_dark": custom_dark

  "style/+":
    candidate_list_layout: stacked
    inline_preedit: true
    translucency: true
    font_face: "Sarasa UI SC"
    font_point: 16
    label_font_point: 13
    comment_font_point: 13
    corner_radius: 8
    hilited_corner_radius: 6
    border_height: -4
    border_width: 8
    line_spacing: 4
    spacing: 8
    base_offset: 0
    alpha: 0.9
    shadow_size: 4

  "preset_color_schemes/+":
    custom_light:
      name: "远峰（亮）"
      author: "rime-theme"
      back_color: 0xF8F6F4                        # 候选窗整体背景色
      border_color: 0xEFEAE5                      # 窗口边框颜色
      text_color: 0x4D4339                        # 已输入编码的文字颜色
      hilited_text_color: 0x3C3022                # 编码行中被选中/转换段的文字颜色
      hilited_back_color: 0xF0EAE4                # 编码行中被选中/转换段的背景色
      label_color: 0xAFA193                       # 普通候选项的序号颜色
      candidate_text_color: 0x4D4339              # 普通候选词的文字颜色
      comment_text_color: 0xBFB4A8                # 候选词的注释文字（如全拼、繁体提示）
      hilited_candidate_text_color: 0x372B1D      # 被选中候选词的文字颜色
      hilited_candidate_back_color: 0xEAE1D7      # 被选中候选项的背景色
      hilited_comment_text_color: 0x98826C        # 被选中候选项的注释文字颜色

    custom_dark:
      name: "远峰（暗）"
      author: "rime-theme"
      back_color: 0x26201B                        # 候选窗整体背景色
      border_color: 0x352D26                      # 窗口边框颜色
      text_color: 0xE4DDD5                        # 已输入编码的文字颜色
      hilited_text_color: 0xF8F3EE                # 编码行中被选中/转换段的文字颜色
      hilited_back_color: 0x3D332A                # 编码行中被选中/转换段的背景色
      label_color: 0x8F8171                       # 普通候选项的序号颜色
      candidate_text_color: 0xE4DDD5              # 普通候选词的文字颜色
      comment_text_color: 0x786858                # 候选词的注释文字（如全拼、繁体提示）
      hilited_candidate_text_color: 0xF8F3EE      # 被选中候选词的文字颜色
      hilited_candidate_back_color: 0x4F4133      # 被选中候选项的背景色
      hilited_comment_text_color: 0xC0A98F        # 被选中候选项的注释文字颜色
